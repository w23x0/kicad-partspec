[project]
name = "kicad-partspec"
version = "0.0.1"
description = "Datasheet-derived PartSpec to verified KiCad symbols and footprints."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "W23x" }]
keywords = ["kicad", "eda", "pcb", "datasheet", "symbol", "footprint", "mcp", "claude"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/w23x0/kicad-partspec"
Repository = "https://github.com/w23x0/kicad-partspec"
Issues = "https://github.com/w23x0/kicad-partspec/issues"

[project.optional-dependencies]
mcp = ["mcp>=2.1"]
dev = [
    "mcp>=2.1",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
kicad-partspec = "kicad_partspec.cli:main"
kicad-partspec-mcp = "kicad_partspec.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_partspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.ruff.lint.per-file-ignores]
# Datasheets print real EN DASH characters (IN1–); tests quote them on purpose.
"tests/*" = ["RUF001"]
